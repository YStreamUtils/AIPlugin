name: Deploy and Release AI Plugin

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Dotnet Publish
        run: |
          dotnet publish -c Release -o ./temp_publish

      - name: Package Plugin
        run: |
          mkdir -p ./publish
          cd ./temp_publish
          zip -r ../publish/AI-Plugin.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create ${{ github.ref_name }} ./publish/AI-Plugin.zip \
            --title "Release ${{ github.ref_name }}" \
            --notes "Automated release for tag ${{ github.ref_name }}"
